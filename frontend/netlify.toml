# Netlify configuration.
# Drag & drop deploys ignore [build] (they publish the dropped folder as-is),
# but [[headers]] and [[redirects]] are honored. Keep the build block in place
# for future Git-based deploys.

[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
