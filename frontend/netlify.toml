# Netlify configuration.
#
# Continuous deployment configurato dalla dashboard Netlify con
# base = "frontend" → questo file viene letto da quel base directory.
# Drag&drop continua a funzionare (publish è la cartella droppata as-is).

[build]
  publish = "."
  # Skip il build quando il push non tocca nulla in frontend/ (es. solo
  # modifiche backend o .claude/). Netlify esegue questo script dalla base
  # directory configurata in dashboard ("frontend"); exit 0 = skip deploy,
  # exit 1 = procedi. NB: serve la cronologia git fetchata da Netlify
  # (settata di default per i siti git-linked).
  ignore = "git diff --quiet HEAD^ HEAD -- ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
