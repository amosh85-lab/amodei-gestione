<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#B5391F" />

  <!--
    Backend URL configuration.
    - Local dev: leave content="" → frontend falls back to http://localhost:8000.
    - Production: set content to your Railway URL, e.g.
      <meta name="amodei-api-url" content="https://amodei-backend.up.railway.app" />
  -->
  <meta name="amodei-api-url" content="https://amodei-gestione-production.up.railway.app" />

  <title>Amodei — Gestionale</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
</head>
<body>
  <main class="boot">
    <section class="boot__card">
      <h1 class="boot__brand">Amodei</h1>
      <p class="boot__tagline">Gestionale Wine Bar</p>
      <div id="status" class="boot__status boot__status--pending" role="status" aria-live="polite">
        <span class="boot__dot" aria-hidden="true"></span>
        <span class="boot__label">Connessione al backend…</span>
      </div>
      <p id="status-detail" class="boot__detail"></p>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
